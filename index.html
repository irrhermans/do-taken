<!DOCTYPE html>
<html lang="nl">
<head>
<title>DO-taken</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#263650">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DO-taken">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">
<style>
:root{
  --navy:#263650;--indigo:#393b70;--teal:#276d80;--panel:#293953;--box:#293953d9;
  --ink:#ffffff;--ink-soft:#e1e7f1;--mint:#79e5dd;--line:#ffffff3b;--rand:#e1e7f199;
  --ground:linear-gradient(110deg,#263650 0%,#393b70 62%,#276d80 100%);
  --font:Poppins,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--navy)}
html,body{margin:0;min-height:100%;color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;background:var(--ground);z-index:-1}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:24px 20px calc(32px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:20px}
.visueel-verborgen{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Inloggen */
.login{justify-content:space-between;padding-top:28px}
.logo{width:150px;height:auto;align-self:flex-start}
.login main{display:flex;flex-direction:column;gap:28px}
.intro{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.pill{display:inline-flex;align-items:center;height:30px;padding:0 14px;border-radius:999px;background:var(--mint);color:var(--navy);font-size:12px;font-weight:700;letter-spacing:1.5px}
h1.groot{margin:0;font-size:44px;line-height:1.05;font-weight:700}
.zacht{margin:0;font-size:16px;line-height:1.45;color:var(--ink-soft)}
.vak{display:flex;flex-direction:column;gap:16px;padding:20px;border-radius:20px;background:var(--box)}
.veld{display:flex;flex-direction:column;gap:8px}
.label{font-size:13px;line-height:1.4;font-weight:700}
.invoer{width:100%;min-height:52px;padding:0 16px;border:1.5px solid var(--rand);border-radius:12px;background:var(--navy);color:#fff;font-size:16px}
textarea.invoer{min-height:96px;padding:14px 16px;line-height:1.45;resize:vertical}
.invoer:focus{border-color:#fff}
.knop{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border:0;border-radius:999px;background:var(--mint);color:var(--navy);font-size:16px;font-weight:700}
.knop[disabled]{opacity:.6;cursor:default}
.knop-tekst{display:flex;align-items:center;justify-content:center;width:100%;height:44px;border:0;background:none;color:#fff;font-size:15px;font-weight:700}
.klein{margin:0;font-size:13px;line-height:1.4;color:var(--ink-soft)}
.melding{margin:0;padding:12px 14px;border-radius:12px;background:#ffffff1f;border:1.5px solid #fff;font-size:14px;line-height:1.4}

/* Lijst */
.kop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.merk{display:flex;align-items:center;gap:10px;min-width:0}
.icoon{width:36px;height:36px;object-fit:contain;flex:none}
.kop h1{margin:0;font-size:22px;line-height:1.1;font-weight:700;white-space:nowrap}
.proef{margin:0;padding:10px 14px;border-radius:12px;border:1.5px dashed var(--mint);font-size:13px;line-height:1.4;color:var(--ink-soft)}
.proef strong{color:var(--mint);letter-spacing:1px;margin-right:6px}
.knop-nieuw{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px;border:0;border-radius:999px;background:var(--mint);color:var(--navy);font-size:14px;font-weight:700;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--rand);background:transparent;color:#fff;font-size:14px;font-weight:400}
.chip[aria-pressed="true"],.chip-radio input:checked+span{border-color:var(--mint);background:var(--mint);color:var(--navy);font-weight:700}
.chip-radio{position:relative;display:inline-flex}
.chip-radio input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip-radio span{display:inline-flex;align-items:center;height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--rand);font-size:14px}
.chip-radio input:focus-visible+span{outline:2px solid #fff;outline-offset:2px}
.schakelaar{display:flex;align-items:center;justify-content:space-between;width:100%;height:44px;padding:0;border:0;background:none;color:#fff;font-size:15px;text-align:left}
.schakelaar .baan{display:flex;align-items:center;width:48px;height:28px;padding:0 3px;border-radius:999px;border:1.5px solid var(--rand);flex:none}
.schakelaar .knopje{width:18px;height:18px;border-radius:999px;background:var(--ink-soft);transition:transform .15s}
.schakelaar[aria-checked="true"] .baan{background:var(--mint);border-color:var(--mint)}
.schakelaar[aria-checked="true"] .knopje{background:var(--navy);transform:translateX(18px)}
.secties{display:flex;flex-direction:column;gap:16px}
.sectie{border-radius:16px;overflow:hidden;background:var(--box)}
.sectie-kop{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 16px;background:var(--mint);color:var(--navy)}
.sectie-kop h2{margin:0;font-size:16px;line-height:1.2;font-weight:700}
.sectie-kop span{font-size:13px;font-weight:700}
.taken{margin:0;padding:0;list-style:none}
.taak{display:flex;flex-direction:column;gap:12px;padding:16px}
.taak+.taak{border-top:1px solid var(--line)}
.taak-tekst{display:flex;align-items:flex-start;gap:12px;min-height:44px;width:100%;padding:0;border:0;background:none;color:#fff;text-align:left;font-size:15px;line-height:1.45}
.taak-tekst span{flex:1;overflow-wrap:anywhere}
.taak-tekst svg{flex:none;margin-top:4px;color:var(--ink-soft)}
.taak.is-klaar .taak-tekst{color:var(--ink-soft)}
.taak-voet{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sinds{font-size:13px;color:var(--ink-soft)}
.status{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--rand);background:transparent;color:#fff;font-size:14px;font-weight:700}
.status.st-bezig{border-color:var(--mint);background:var(--mint);color:var(--navy)}
.status.st-wachtop{border-style:dashed;background:#ffffff29}
.status.st-klaar{border-color:transparent;background:#ffffff14;color:var(--ink-soft)}
.leeg{margin:0;padding:16px;font-size:15px;color:var(--ink-soft)}
.voet{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto}
.voet .knop-tekst{width:auto;padding:0 4px;font-weight:400;font-size:14px;color:var(--ink-soft);text-decoration:underline}
.laden{display:flex;flex-direction:column;gap:16px}
.laden div{height:140px;border-radius:16px;background:var(--box);animation:puls 1.2s ease-in-out infinite alternate}
@keyframes puls{from{opacity:.55}to{opacity:1}}

/* Dialogen */
dialog{padding:0;border:0;color:#fff;font-family:var(--font)}
dialog::backdrop{background:#0d1424b3}
.scherm{width:100%;max-width:480px;height:100%;max-height:100%;margin:0 auto;background:var(--ground)}
.scherm form{min-height:100%;padding:20px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:20px}
.scherm-kop{display:flex;align-items:center;gap:4px}
.terug{display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-left:-12px;border:0;border-radius:999px;background:none;color:#fff}
.scherm-kop h2{margin:0;font-size:20px;line-height:1.2;font-weight:700}
fieldset{min-width:0;margin:0;padding:0;border:0}
legend{padding:0 0 8px;font-size:13px;line-height:1.4;font-weight:700}
.opties{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:var(--box)}
.optie{position:relative;display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;font-size:15px;cursor:pointer}
.optie+.optie{border-top:1px solid var(--line)}
.optie input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.optie .tekst{flex:1}
.optie .rondje{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:999px;border:1.5px solid var(--rand);flex:none}
.optie input:checked~.tekst{font-weight:700}
.optie input:checked~.rondje{border-color:var(--mint)}
.optie input:checked~.rondje::after{content:"";width:10px;height:10px;border-radius:999px;background:var(--mint)}
.optie:has(input:focus-visible){outline:2px solid #fff;outline-offset:-2px}
.acties{display:flex;flex-direction:column;gap:4px;margin-top:auto}
.blad{width:100%;max-width:480px;margin:auto auto 0;border-radius:20px 20px 0 0;background:var(--panel)}
.blad-binnen{padding:20px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.blad h2{margin:0;font-size:18px;font-weight:700}
.blad .zacht{font-size:14px}
.blad .opties{background:#ffffff0f}
.blad-optie{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 16px;border:0;background:none;color:#fff;font-size:15px;text-align:left}
.blad-optie+.blad-optie{border-top:1px solid var(--line)}
.blad-optie[aria-current="true"]{font-weight:700}
.blad-optie[aria-current="true"]::after{content:"";margin-left:auto;width:10px;height:10px;border-radius:999px;background:var(--mint)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 40px);padding:12px 18px;border-radius:999px;background:#fff;color:var(--navy);font-size:14px;font-weight:700;box-shadow:0 6px 24px #0006;z-index:10}
</style>

<body>

<!-- Inloggen -->
<div id="v-login" class="app login" hidden>
  <img id="logo" class="logo" alt="Intents Festival">
  <main>
    <div class="intro">
      <span class="pill">DIRECTIEOVERLEG</span>
      <h1 class="groot">DO-taken</h1>
      <p class="zacht">Vul het wachtwoord in om de takenlijst te openen.</p>
    </div>
    <form id="login-form" class="vak" novalidate>
      <div class="veld">
        <label for="wachtwoord" class="label">Wachtwoord</label>
        <input id="wachtwoord" class="invoer" type="password" autocomplete="current-password" required>
      </div>
      <p id="login-melding" class="melding" role="alert" hidden></p>
      <button id="login-knop" class="knop" type="submit">Inloggen</button>
      <p class="klein">Je blijft 30 dagen ingelogd op dit apparaat.</p>
    </form>
  </main>
  <p class="klein">Intents Festival · DO-taken</p>
</div>

<!-- Takenlijst -->
<div id="v-lijst" class="app" hidden>
  <header class="kop">
    <div class="merk">
      <img id="icoon" class="icoon" alt="">
      <h1>DO-taken</h1>
    </div>
    <button id="nieuw" class="knop-nieuw" type="button">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Nieuwe taak</span>
    </button>
  </header>
  <p id="proef" class="proef" hidden><strong>PROEF</strong> Wijzigingen gaan naar een kopie van de sheet, niet naar de echte takenlijst.</p>
  <div class="veld">
    <span class="label" id="wie-label" style="color:var(--ink-soft)">Wie</span>
    <div id="filter" class="chips" role="group" aria-labelledby="wie-label"></div>
  </div>
  <button id="toon-klaar" class="schakelaar" type="button" role="switch" aria-checked="false">
    <span>Afgeronde taken tonen</span>
    <span class="baan" aria-hidden="true"><span class="knopje"></span></span>
  </button>
  <div id="laden" class="laden" aria-label="Taken laden"><div></div><div></div></div>
  <div id="secties" class="secties" aria-live="polite"></div>
  <footer class="voet">
    <span id="bijgewerkt" class="klein"></span>
    <button id="uitloggen" class="knop-tekst" type="button">Uitloggen</button>
  </footer>
</div>

<!-- Taak aanpassen / nieuwe taak -->
<dialog id="d-taak" class="scherm" aria-labelledby="taak-titel">
  <form id="taak-form" method="dialog" novalidate>
    <div class="scherm-kop">
      <button class="terug" type="button" data-sluit aria-label="Terug naar de takenlijst">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2 id="taak-titel">Taak aanpassen</h2>
    </div>
    <div class="veld">
      <label for="taak-tekst" class="label">Taak</label>
      <textarea id="taak-tekst" class="invoer" rows="3" maxlength="300" required></textarea>
    </div>
    <fieldset>
      <legend>Wie</legend>
      <div id="taak-wie" class="chips"></div>
    </fieldset>
    <fieldset>
      <legend>Status</legend>
      <div id="taak-status" class="opties"></div>
    </fieldset>
    <p id="taak-info" class="klein"></p>
    <p id="taak-melding" class="melding" role="alert" hidden></p>
    <div class="acties">
      <button id="taak-opslaan" class="knop" type="submit">Opslaan</button>
      <button class="knop-tekst" type="button" data-sluit>Annuleren</button>
    </div>
  </form>
</dialog>

<!-- Status kiezen -->
<dialog id="d-status" class="blad" aria-labelledby="status-titel">
  <div class="blad-binnen">
    <div>
      <h2 id="status-titel">Status wijzigen</h2>
      <p id="status-taak" class="zacht"></p>
    </div>
    <div id="status-opties" class="opties"></div>
    <button class="knop-tekst" type="button" data-sluit>Annuleren</button>
  </div>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';

  var WIE = ['Remko', 'Rick', 'Toine', 'Marijn', 'Te verdelen'];

    laatsteLaad: 0
  };
  if (S.filter !== 'Alles' && WIE.indexOf(S.filter) < 0) S.filter = 'Alles';

  function $(id) { return document.getElementById(id); }

  function opslag(sleutel, waarde) {
    try {
      if (waarde === undefined) return window.localStorage.getItem(sleutel);
      if (waarde === null) window.localStorage.removeItem(sleutel);
      else window.localStorage.setItem(sleutel, waarde);
    } catch (e) { /* opslag niet beschikbaar */ }
    return null;
  }

  var API = 'https://script.google.com/macros/s/AKfycbzpHwWzWdyBo2mu_JaPaDLEvPcd8sc94-pwfyPg2m3j0cWZRgUNdEuUr1UOJ_PwTbas_g/exec';

  function server(naam) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (window.google && google.script && google.script.run) {
      return new Promise(function (ok, fout) {
        var run = google.script.run.withSuccessHandler(ok).withFailureHandler(fout);
        run[naam].apply(run, args);
      });
    }
    // Buiten Google (eigen webadres): via de API, zonder Google-cookies.
    var verzoek = { actie: naam };
    if (naam === 'login') verzoek.wachtwoord = args[0];
    else { verzoek.token = args[0]; if (args[1]) verzoek.invoer = args[1]; }
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(verzoek),
      credentials: 'omit',
      redirect: 'follow'
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  function el(tag, attrs, kinderen) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'tekst') n.textContent = attrs[k];
      else if (k === 'html') n.innerHTML = attrs[k];
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (kinderen || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  function svg(inhoud, maat) {
    return '<svg width="' + maat + '" height="' + maat + '" viewBox="0 0 16 16" fill="none" aria-hidden="true">' + inhoud + '</svg>';
  }

  function statusKlasse(status) {
    return 'st-' + String(status).toLowerCase().replace(/[^a-z]/g, '');
  }

  var toastTimer;
  function toast(tekst) {
    var t = $('toast');
    t.textContent = tekst;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 3200);
  }

  function toon(view) {
    $('v-login').hidden = view !== 'login';
    $('v-lijst').hidden = view !== 'lijst';
  }

  /* ---------- Inloggen ---------- */

  function naarLogin(melding) {
    S.token = null;
    opslag('do_token', null);
    toon('login');
    var m = $('login-melding');
    m.textContent = melding || '';
    m.hidden = !melding;
    $('wachtwoord').value = '';
    $('wachtwoord').focus();
  }

  $('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var ww = $('wachtwoord').value;
    var m = $('login-melding');
    if (!ww.trim()) {
      m.textContent = 'Vul het wachtwoord in.';
      m.hidden = false;
      return;
    }
    var knop = $('login-knop');
    knop.disabled = true;
    knop.textContent = 'Bezig met inloggen…';
    server('login', ww).then(function (r) {
      if (r && r.ok) {
        S.token = r.token;
        opslag('do_token', r.token);
        $('wachtwoord').value = '';
        m.hidden = true;
        openLijst();
        return;
      }
      var teksten = {
        FOUT: 'Dat wachtwoord klopt niet.',
        GEBLOKKEERD: 'Te veel pogingen. Probeer het over een kwartier opnieuw.',
        GEEN_WACHTWOORD: 'Er is nog geen wachtwoord ingesteld. Vraag Remko om het in te stellen.'
      };
      m.textContent = teksten[r && r.reden] || 'Inloggen lukte niet. Probeer het opnieuw.';
      m.hidden = false;
    }).catch(function () {
      m.textContent = 'Geen verbinding. Controleer je internet en probeer het opnieuw.';
      m.hidden = false;
    }).then(function () {
      knop.disabled = false;
      knop.textContent = 'Inloggen';
    });
  });

  $('uitloggen').addEventListener('click', function () {
    S.taken = [];
    naarLogin();
  });

  /* ---------- Lijst ---------- */

  function openLijst() {
    toon('lijst');
    tekenFilter();
    tekenSchakelaar();
    $('laden').hidden = S.taken.length > 0;
    if (S.taken.length) tekenTaken();
    laad();
  }

  function verwerk(r, foutTekst) {
    if (r && r.ok) {
      S.taken = r.taken || [];
      S.laatsteLaad = Date.now();
      $('proef').hidden = r.modus !== 'PROEF';
      var nu = new Date();
      $('bijgewerkt').textContent = 'Bijgewerkt om ' + nu.getHours() + ':' + String(nu.getMinutes()).padStart(2, '0');
      $('laden').hidden = true;
      tekenTaken();
      return true;
    }
    if (r && r.reden === 'SESSIE') {
      naarLogin('Je sessie is verlopen. Log opnieuw in.');
      return false;
    }
    if (r && r.reden === 'GEWIJZIGD') {
      S.taken = r.taken || S.taken;
      tekenTaken();
      toast('Deze taak is net door iemand anders gewijzigd. Bekijk hem opnieuw.');
      return false;
    }
    if (r && r.reden === 'ONGELDIG') {
      toast(r.melding || foutTekst);
      return false;
    }
    toast(foutTekst || 'Er ging iets mis. Probeer het opnieuw.');
    return false;
  }

  function laad() {
    return server('haalTaken', S.token).then(function (r) {
      verwerk(r, 'De taken konden niet worden geladen.');
    }).catch(function () {
      $('laden').hidden = true;
      toast('Geen verbinding. De taken konden niet worden geladen.');
    });
  }

  function tekenFilter() {
    var f = $('filter');
    f.textContent = '';
    ['Alles'].concat(WIE).forEach(function (naam) {
      f.appendChild(el('button', {
        type: 'button', 'class': 'chip', 'aria-pressed': String(S.filter === naam), tekst: naam,
        onclick: function () {
          S.filter = naam;
          opslag('do_filter', naam);
          tekenFilter();
          tekenTaken();
        }
      }));
    });
  }

  function tekenSchakelaar() {
    $('toon-klaar').setAttribute('aria-checked', String(S.toonKlaar));
  }

  $('toon-klaar').addEventListener('click', function () {
    S.toonKlaar = !S.toonKlaar;
    opslag('do_klaar', S.toonKlaar ? '1' : '0');
    tekenSchakelaar();
    tekenTaken();
  });

  function tekenTaken() {
    var wrap = $('secties');
    wrap.textContent = '';
    var personen = S.filter === 'Alles' ? WIE.slice() : [S.filter];
    if (S.filter === 'Alles') {
      S.taken.forEach(function (t) { if (personen.indexOf(t.wie) < 0) personen.push(t.wie); });
    }
    var getekend = 0;
    personen.forEach(function (naam) {
      var alle = S.taken.filter(function (t) { return t.wie === naam; });
      var open = alle.filter(function (t) { return t.status !== 'Klaar'; });
      var klaar = alle.filter(function (t) { return t.status === 'Klaar'; });
      var zichtbaar = S.toonKlaar ? open.concat(klaar) : open;
      if (!zichtbaar.length && S.filter === 'Alles') return;
      getekend++;
      var telling = open.length + ' open' + (S.toonKlaar && klaar.length ? ' · ' + klaar.length + ' klaar' : '');
      var lijst = el('ul', { 'class': 'taken' }, zichtbaar.map(tekenTaak));
      wrap.appendChild(el('section', { 'class': 'sectie', 'aria-label': naam || 'Zonder naam' }, [
        el('div', { 'class': 'sectie-kop' }, [el('h2', { tekst: naam || 'Zonder naam' }), el('span', { tekst: telling })]),
        zichtbaar.length ? lijst : el('p', { 'class': 'leeg', tekst: 'Geen open taken.' })
      ]));
    });
    if (!getekend) wrap.appendChild(el('div', { 'class': 'sectie' }, [el('p', { 'class': 'leeg', tekst: 'Geen open taken.' })]));
  }

  function tekenTaak(t) {
    var tekst = el('button', { type: 'button', 'class': 'taak-tekst', onclick: function () { openTaak(t); } }, [el('span', { tekst: t.taak })]);
    tekst.insertAdjacentHTML('beforeend', PIJL_RECHTS);
    var status = el('button', {
      type: 'button', 'class': 'status ' + statusKlasse(t.status), 'aria-haspopup': 'dialog',
      'aria-label': 'Status: ' + t.status + '. Tik om te wijzigen',
      onclick: function () { openStatus(t); }
    });
    status.innerHTML = svg(ICOON[t.status] || ICOON['Te doen'], 16);
    status.appendChild(el('span', { tekst: t.status || 'Geen status' }));
    status.insertAdjacentHTML('beforeend', PIJL_OMLAAG);
    return el('li', { 'class': 'taak' + (t.status === 'Klaar' ? ' is-klaar' : '') }, [
      tekst,
      el('div', { 'class': 'taak-voet' }, [status, el('span', { 'class': 'sinds', tekst: t.datum ? 'Sinds ' + t.datum : '' })])
    ]);
  }

  /* ---------- Status snel wijzigen ---------- */

  function openStatus(t) {
    S.statusTaak = t;
    $('status-taak').textContent = t.taak;
    var opties = $('status-opties');
    opties.textContent = '';
    STATUS.forEach(function (st) {
      var b = el('button', { type: 'button', 'class': 'blad-optie', 'aria-current': String(st === t.status), onclick: function () { kiesStatus(st); } });
      b.innerHTML = svg(ICOON[st], 18);
      b.appendChild(el('span', { tekst: st }));
      opties.appendChild(b);
    });
    $('d-status').showModal();
  }

  function kiesStatus(st) {
    var t = S.statusTaak;
    $('d-status').close();
    if (!t || st === t.status) return;
    var oud = t.status;
    t.status = st;
    tekenTaken();
    server('wijzigTaak', S.token, { rij: t.rij, sleutel: t.sleutel, wie: t.wie, taak: t.taak, status: st }).then(function (r) {
      if (verwerk(r, 'De status is niet opgeslagen.')) toast(st === 'Klaar' ? 'Afgerond' : 'Status opgeslagen');
      else if (!r || (r.reden !== 'GEWIJZIGD' && r.reden !== 'SESSIE')) { t.status = oud; tekenTaken(); }
    }).catch(function () {
      t.status = oud;
      tekenTaken();
      toast('Geen verbinding. De status is niet opgeslagen.');
    });
  }

  /* ---------- Taak aanpassen / nieuw ---------- */

  function openTaak(t) {
    S.bewerk = t || null;
    $('taak-titel').textContent = t ? 'Taak aanpassen' : 'Nieuwe taak';
    $('taak-tekst').value = t ? t.taak : '';
    var gekozenWie = t ? t.wie : (S.filter !== 'Alles' ? S.filter : '');
    var wie = $('taak-wie');
    wie.textContent = '';
    WIE.forEach(function (naam, i) {
      var input = el('input', { type: 'radio', name: 'wie', value: naam, id: 'wie-' + i });
      input.checked = naam === gekozenWie;
      wie.appendChild(el('label', { 'class': 'chip-radio', 'for': 'wie-' + i }, [input, el('span', { tekst: naam })]));
    });
    var statusWrap = $('taak-status');
    statusWrap.textContent = '';
    var gekozenStatus = t ? t.status : 'Te doen';
    STATUS.forEach(function (st, i) {
      var input = el('input', { type: 'radio', name: 'status', value: st, id: 'st-' + i });
      input.checked = st === gekozenStatus;
      var label = el('label', { 'class': 'optie', 'for': 'st-' + i }, [input]);
      label.insertAdjacentHTML('beforeend', svg(ICOON[st], 18));
      label.appendChild(el('span', { 'class': 'tekst', tekst: st }));
      label.appendChild(el('span', { 'class': 'rondje', 'aria-hidden': 'true' }));
      statusWrap.appendChild(label);
    });
    $('taak-info').textContent = t
      ? 'Aangemaakt op ' + t.datum + '. Is de taak afgerond? Zet de status dan op Klaar.'
      : 'De aanmaakdatum wordt vandaag.';
    $('taak-melding').hidden = true;
    $('taak-opslaan').disabled = false;
    $('taak-opslaan').textContent = t ? 'Opslaan' : 'Toevoegen';
    $('d-taak').showModal();
    if (!t) $('taak-tekst').focus();
  }

  $('nieuw').addEventListener('click', function () { openTaak(null); });

  $('taak-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var m = $('taak-melding');
    var taak = $('taak-tekst').value.replace(/\s+/g, ' ').trim();
    var wieInput = document.querySelector('input[name="wie"]:checked');
    var stInput = document.querySelector('input[name="status"]:checked');
    var fout = !taak ? 'Vul de taak in.' : !wieInput ? 'Kies wie de taak oppakt.' : !stInput ? 'Kies een status.' : '';
    if (fout) { m.textContent = fout; m.hidden = false; return; }
    m.hidden = true;
    var gegevens = { wie: wieInput.value, taak: taak, status: stInput.value };
    var t = S.bewerk;
    if (t && t.wie === gegevens.wie && t.taak === gegevens.taak && t.status === gegevens.status) {
      $('d-taak').close();
      return;
    }
    var knop = $('taak-opslaan');
    knop.disabled = true;
    knop.textContent = 'Bezig met opslaan…';
    var verzoek = t
      ? server('wijzigTaak', S.token, { rij: t.rij, sleutel: t.sleutel, wie: gegevens.wie, taak: gegevens.taak, status: gegevens.status })
      : server('nieuweTaak', S.token, gegevens);
    verzoek.then(function (r) {
      if (verwerk(r, 'De taak is niet opgeslagen.')) {
        $('d-taak').close();
        toast(t ? 'Taak opgeslagen' : 'Taak toegevoegd');
      } else if (r && (r.reden === 'GEWIJZIGD' || r.reden === 'SESSIE')) {
        $('d-taak').close();
      }
    }).catch(function () {
      m.textContent = 'Geen verbinding. De taak is niet opgeslagen.';
      m.hidden = false;
    }).then(function () {
      knop.disabled = false;
      knop.textContent = t ? 'Opslaan' : 'Toevoegen';
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-sluit]'), function (b) {
    b.addEventListener('click', function () { b.closest('dialog').close(); });
  });
  $('d-status').addEventListener('click', function (e) {
    if (e.target === e.currentTarget) e.currentTarget.close();
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible' || !S.token || $('v-lijst').hidden) return;
    if ($('d-taak').open || $('d-status').open) return;
    if (Date.now() - S.laatsteLaad > 30000) laad();
  });

  /* ---------- Start ---------- */

  if (window.BEELD) {
    $('logo').src = window.BEELD.logo;
    $('icoon').src = window.BEELD.icoon;
  }
  if (S.token) openLijst();
  else naarLogin();
})();
</script>
</body>
</html>
